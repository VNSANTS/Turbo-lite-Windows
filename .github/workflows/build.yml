name: Build Turbo Lite Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/TurboLite.Windows/TurboLite.Windows.csproj --configuration Release
      - name: Publish self-contained x64 app
        run: dotnet publish src/TurboLite.Windows/TurboLite.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/TurboLite-Windows-win-x64
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboLite-Windows-win-x64
          path: artifacts/TurboLite-Windows-win-x64/
          if-no-files-found: error
